<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="760" fill="#ffffff"/>
  <style>
    .box{fill:#ffffff;stroke:#222;stroke-width:1.5;}
    .side{fill:#f4f4f4;stroke:#555;stroke-width:1.2;}
    .ph{fill:#1F4E78;}
    .t{font-size:13px;fill:#111;}
    .tb{font-size:13px;fill:#111;font-weight:bold;}
    .pt{font-size:13px;fill:#ffffff;font-weight:bold;}
    .arr{stroke:#222;stroke-width:1.5;marker-end:url(#a);}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#222"/></marker></defs>

  <!-- phase labels -->
  <rect class="ph" x="12" y="30" width="30" height="190"/><text class="pt" x="27" y="125" transform="rotate(-90 27,125)" text-anchor="middle">Identification</text>
  <rect class="ph" x="12" y="240" width="30" height="230"/><text class="pt" x="27" y="355" transform="rotate(-90 27,355)" text-anchor="middle">Screening</text>
  <rect class="ph" x="12" y="490" width="30" height="230"/><text class="pt" x="27" y="605" transform="rotate(-90 27,605)" text-anchor="middle">Included</text>

  <!-- identification -->
  <rect class="box" x="70" y="30" width="400" height="120"/>
  <text class="tb" x="85" y="52">Records identified (2019–2026):</text>
  <text class="t" x="85" y="72">OpenAlex (13 title-scoped cluster queries): n = 12,021</text>
  <text class="t" x="85" y="90">ACM DL, 2nd primary database (same 13 clusters): n = 278</text>
  <text class="t" x="85" y="108">   → 250 duplicates of OpenAlex removed; 28 net-new</text>
  <text class="t" x="85" y="126">Backward snowball (title-relevant, new): n = 5,633</text>
  <text class="tb" x="85" y="144">Unique identified: n = 17,682</text>

  <rect class="side" x="500" y="30" width="245" height="120"/>
  <text class="tb" x="512" y="52">Coverage probes (counts only):</text>
  <text class="t" x="512" y="70">IEEE, ScienceDirect, Scopus,</text>
  <text class="t" x="512" y="88">Crossref, Semantic Scholar.</text>
  <text class="t" x="512" y="106">Web of Science: unresolved (no access)</text>
  <text class="t" x="512" y="130">Single-source robustness: ACM shifts</text>
  <text class="t" x="512" y="146">the pool by 28/12,021 (0.23%).</text>

  <line class="arr" x1="270" y1="150" x2="270" y2="250"/>

  <!-- screening -->
  <rect class="box" x="70" y="250" width="400" height="70"/>
  <text class="tb" x="85" y="274">Records screened (title + abstract),</text>
  <text class="t" x="85" y="292">citation-ordered tiers, dual independent rating:</text>
  <text class="tb" x="85" y="310">n = 1,600  (primary 800 + snowball 800)</text>

  <rect class="side" x="500" y="250" width="245" height="70"/>
  <text class="tb" x="512" y="274">Excluded (E1–E8): n = 705</text>
  <text class="t" x="512" y="292">primary 143 + snowball 562</text>
  <text class="t" x="512" y="310">(E6 out-of-scope dominant)</text>
  <line class="arr" x1="470" y1="285" x2="500" y2="285"/>

  <line class="arr" x1="270" y1="320" x2="270" y2="370"/>

  <rect class="box" x="70" y="370" width="400" height="80"/>
  <text class="tb" x="85" y="392">Inter-rater agreement (Cohen's κ):</text>
  <text class="t" x="85" y="412">primary tier κ = 0.45 (fully reconciled)</text>
  <text class="t" x="85" y="430">snowball tier κ = 0.63</text>
  <text class="t" x="85" y="446">method-in-domain sub-rule applied uniformly</text>

  <rect class="side" x="500" y="370" width="245" height="80"/>
  <text class="tb" x="512" y="390">ACM net-new screened (κ = 1.00):</text>
  <text class="t" x="512" y="408">20 rated → 3 include / 17 exclude</text>
  <text class="t" x="512" y="426">(+8 pre-struck E7/E8); living 2026</text>
  <text class="t" x="512" y="444">tier held for refresh</text>
  <line class="arr" x1="470" y1="410" x2="500" y2="410"/>

  <line class="arr" x1="270" y1="450" x2="270" y2="510"/>

  <!-- included -->
  <rect class="box" x="70" y="510" width="400" height="70"/>
  <text class="tb" x="85" y="534">Studies included in mapping sample:</text>
  <text class="tb" x="85" y="554">n = 898</text>
  <text class="t" x="230" y="554">(primary 657 + snowball 238 + ACM 3)</text>

  <rect class="side" x="500" y="510" width="245" height="90"/>
  <text class="tb" x="512" y="532">Reproducibility of prior corpus</text>
  <text class="t" x="512" y="550">(identification level, vs 119 cited):</text>
  <text class="t" x="512" y="568">IEEE-only 43 → +OpenAlex 56</text>
  <text class="tb" x="512" y="586">→ +snowball 75 / 119  (67% in-window)</text>

  <text class="t" x="70" y="630" font-style="italic" fill="#555">Reported per PRISMA-ScR (Tricco et al., 2018). Last search 2026-11-19; living-review currency.</text>
  <text class="t" x="70" y="650" font-style="italic" fill="#555">OpenAlex + ACM Digital Library as primary databases; further indices as coverage probes.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
